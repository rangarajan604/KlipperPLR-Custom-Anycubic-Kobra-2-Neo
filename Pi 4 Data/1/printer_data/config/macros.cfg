[gcode_macro PULL_FILAMENT_OUT]
description: Heat nozzle and unload filament safely
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  SAVE_GCODE_STATE NAME=pull_filament_state
  
  # Only heat if current target is lower than EXTRUDER_TEMP
  {% if printer.extruder.target < EXTRUDER_TEMP %}
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}
  {% elif printer.extruder.temperature < EXTRUDER_TEMP %}
    M109 S{EXTRUDER_TEMP}
  {% endif %}

  M83 ; Set extruder to relative mode
  G1 E5 F500 ; Push 5mm to shape tip
  G1 E-50 F300 ; Unload 150mm (split into 50mm steps to avoid extrude limit error)
  G1 E-50 F300
  G1 E-50 F300

  RESTORE_GCODE_STATE NAME=pull_filament_state

  # If paused, only unlock the extruder motor so X/Y/Z stay homed and locked!
  {% if printer.pause_resume.is_paused %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  {% else %}
    M84 ; Turn off all motors only when NOT in a paused print
    SAVE_VARIABLE VARIABLE=plr_excluded_objects VALUE='""'
  {% endif %}

  # Send confirmation message to the consol
  beeper I=2 P=1000
  RESPOND MSG="FILAMENT_OUT!"


[gcode_macro FILAMENT_INSERT]
description: Heat nozzle and load/purge filament safely
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
  SAVE_GCODE_STATE NAME=insert_filament_state

  # Only heat if current target is lower than EXTRUDER_TEMP
  {% if printer.extruder.target < EXTRUDER_TEMP %}
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}
  {% elif printer.extruder.temperature < EXTRUDER_TEMP %}
    M109 S{EXTRUDER_TEMP}
  {% endif %}

  M83 ; Set extruder to relative mode
  G1 E40 F500 ; Extrude 40mm of filament

  RESTORE_GCODE_STATE NAME=insert_filament_state

  # Keep X/Y/Z/E motors locked if paused so RESUME works without homing!
  {% if not printer.pause_resume.is_paused %}
    M84 ; Turn off all motors only when NOT in a paused print
  {% endif %}

  # Send confirmation message to the consol
  beeper I=2 P=1000
  RESPOND MSG="FILAMENT_INSERT!"

[gcode_macro CANCEL_PRINT]
gcode:
  {% set homed_axes = printer.toolhead.homed_axes %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  {% if 'z' in homed_axes %}
    G91
    G0 Z10 F3600
    G90
  {% endif %}
  {% if 'x' in homed_axes and 'y' in homed_axes and 'z' in homed_axes %}
    G0 X125 Y200 F20000
  {% endif %}
  M107 ; turn off fan
  G90 ; absolute positioning
  BED_MESH_CLEAR
  
  # Send confirmation message to the consol
  RESPOND MSG="CANCEL_PRINT !"

[gcode_macro DRY_FILAMENT]
gcode:
  TURN_OFF_HEATERS
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=60
  G4 P10800000 #3 hours (3*60*60*1000)

[gcode_macro START_PRINT]
gcode:
  G31
  save_last_file
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
  SAVE_VARIABLE VARIABLE=plr_excluded_objects VALUE='""'
  SAVE_VARIABLE VARIABLE=plr_excluded_objects VALUE='""'

  TURN_OFF_HEATERS
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}

  # Set absolute position and Homing
  beeper I=1 P=100
  G90
  M106 S0
  G28 X Y

  # Start bed heating
  M140 S{BED_TEMP}
  
  # Wait for bed to reach temperature
  M190 S{BED_TEMP}

  # Wait For 10 Second 
  G4 P10000

  # Load default bed mesh
  beeper I=2 P=100
  G28 Z
  BED_MESH_CALIBRATE ADAPTIVE=1
  G28 Z

  # prefered area for heating
  G1 X-6 Y0

  # Start hotend heating
  beeper I=3 P=100
  M104 S{EXTRUDER_TEMP}
  
  # Set and wait for nozzle to reach temperature
  M109 S{EXTRUDER_TEMP}

  # Start Wast cleaing befor Peint start
  # Move nozzle to 0.2mm above bed
  beeper I=3 P=1000
  G1 Z0.1 F2400

  # Move X to center of 220mm bed
  G1 X110 F2400

  G92 E0                        ; zero the extruded length
  G1 X110 Y-2 Z0.2 F2400        ; move to start of purge line
  G1 E3 F1000                   ; prime nozzle
  G1 X130 E22 F500              ; Extrude 22mm of filament in a 2cm line.
  G1 X150 E22 F2400             ; Move 20mm further without extruding (wipe move)
  G1 Z1                         ; Lift Z

  # Send confirmation message to the consol
  RESPOND MSG="Print started!"


[gcode_macro PRINT_END]
 gcode:
  M106 S0
  G91
  G1 E-5 F1000
  G1 Z30 F200
  G90
  
  G1 F2000 X20
  G1 F2500 Y200 ; expose the print
  M140 S0
  M104 S0
  M84 #motors off
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  SAVE_VARIABLE VARIABLE=plr_excluded_objects VALUE='""'
  clear_last_file
  G31
  beeper I=5 P=100

[gcode_macro TORTURE_TEST]
# LOOP Torture test. Make sure you have no filament loaded as it will also trigger the extruder motor.
gcode:
    # Absolute positioning
    G90

    # Heat up just for safety.
    {% set EXTRUDER_TEMP = 200 %}
    M104 S{EXTRUDER_TEMP}
    G28
    M109 S{EXTRUDER_TEMP}
    {% set vel = range(150, 200) %} # set velocity values to be tested (mm/s)
    {% set accel = range(5000, 5100) %} # set accel values to be tested (mm/s^2)
    {% set min_x = 115 %}
    {% set max_x = 120 %}
    {% set min_y = 115 %}
    {% set max_y = 120 %}
    G1 X{min_x} Y{min_y} F15000

     {% for V in vel %}
        {% set machineVel = V*60 %}
        {% for A in accel %}
            RESPOND MSG="velocity:{V}mm/s, accel:{A}mm/s^2"
            SET_VELOCITY_LIMIT VELOCITY={V}
            SET_VELOCITY_LIMIT ACCEL={A}
            G1 X{max_x} Y{min_y} F{machineVel} E1
            G1 X{max_x} Y{max_y} F{machineVel} E0.5
            G1 X{min_x} Y{min_y} F{machineVel} E2
            G1 X{min_x} Y{max_y} F{machineVel} E0.25
            G1 X{max_x} Y{min_y} F{machineVel} E1
            G1 X{max_x} Y{min_y} F{machineVel} E0.4
            G1 X{max_x} Y{max_y} F{machineVel} E0.15
            G1 X{min_x} Y{max_y} F{machineVel} E0.05
            G1 X{min_x} Y{min_y} F{machineVel} E0.5
            G1 X{max_x} Y{min_y} F{machineVel} E-0.5
            G1 X{max_x} Y{max_y} F{machineVel} E-0.2
            G1 X{min_x} Y{min_y} F{machineVel} E1
            G1 X{min_x} Y{max_y} F{machineVel} E-0.25
            G1 X{max_x} Y{min_y} F{machineVel} E-1.5
            G1 X{max_x} Y{min_y} F{machineVel} E-0.4
            G1 X{max_x} Y{max_y} F{machineVel} E-0.15
            G1 X{min_x} Y{max_y} F{machineVel} E-0.05
            G1 X{min_x} Y{min_y} F{machineVel} E0.55
            G1 X{max_x} Y{min_y} F{machineVel} E1
            G1 X{max_x} Y{max_y} F{machineVel} E0.5
            G1 X{min_x} Y{min_y} F{machineVel} E-2
            G1 X{min_x} Y{max_y} F{machineVel} E-0.25
            G1 X{max_x} Y{min_y} F{machineVel} E-1
            G1 X{max_x} Y{min_y} F{machineVel} E0.4
            G1 X{max_x} Y{max_y} F{machineVel} E0.15
            G1 X{min_x} Y{max_y} F{machineVel} E0.05
            G1 X{min_x} Y{min_y} F{machineVel} E0.5
            G1 X{max_x} Y{min_y} F{machineVel} E-0.5
            G1 X{max_x} Y{max_y} F{machineVel} E-0.2
            G1 X{min_x} Y{min_y} F{machineVel} E1
            G1 X{min_x} Y{max_y} F{machineVel} E-0.25
            G1 X{max_x} Y{min_y} F{machineVel} E-1.5
            G1 X{max_x} Y{min_y} F{machineVel} E-0.4
            G1 X{max_x} Y{max_y} F{machineVel} E-0.15
            G1 X{min_x} Y{max_y} F{machineVel} E-0.05
            G1 X{min_x} Y{min_y} F{machineVel} E0.55
            #G4 P200
        {% endfor %}
    {% endfor %}

    # restore original limits
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}

[gcode_macro PID_BED_55]
gcode:
  # Run the calibration
  PID_CALIBRATE HEATER=heater_bed TARGET=55
  # Save the configuration and restart Klipper automatically
  SAVE_CONFIG

[gcode_macro PID_EXTRUDER_195]
gcode:
  # home and prefer area
  G90
  G28
  G1 X2 Y-2
  # Run the calibration
  # Start bed heating
  M140 S55
  # Wait for bed to reach temperature
  M190 S55

  PID_CALIBRATE HEATER=extruder TARGET=195
  # Save the configuration and restart Klipper automatically
  SAVE_CONFIG

######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

#[pause_resume]


[gcode_macro T1]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=T1_state
    PAUSE
    G91
    G1 E-.5 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
	PULL_FILAMENT_OUT
    #G1 E-100 F1000
    beeper I=5 P=1000
    RESTORE_GCODE_STATE NAME=T1_state
