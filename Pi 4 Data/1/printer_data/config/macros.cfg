[gcode_macro Z_ENDSTOP_HIT]
gcode:
  {% set Z_ENDSTOP_HIT = printer.save_variables.variables.z_endstop_hit | default(0) | float | round(3) %}
  RESPOND TYPE=command MSG="Reset z_endstop_hit from {Z_ENDSTOP_HIT} to 0.0"
  SAVE_VARIABLE VARIABLE=z_endstop_hit VALUE=0
  G90
  G1 X58.3 Y239.0 Z5 F8000
  # TODO -> Add retraction and wipe, make sure it is in center!
  M400
  G1 X58.3 Y239.0 Z3 F3000
  M400
  G91
  {% set z_count = 500 %}
  {% for cz in range(z_count) %}
    _MOVE_Z_DOWN
  {% endfor %}

[gcode_macro _MOVE_Z_DOWN]
gcode:
  {% if printer.save_variables.variables.z_endstop_hit == 0 %}
    G1 Z-0.025 F50
    M400
    _CHECK_Z_HIT
  {% endif %} 
  
[gcode_macro _CHECK_Z_HIT]
variable_z_end: 0
gcode:
    {% set Z_POSITION = printer.toolhead.position.z | default(0) | float | round(3) %}
    {% set Z_PROBE_OFFSET = printer.configfile.settings.probe.z_offset | default(0) | float | round(3) %}
    {% set Z_PRINTBED_OFFSET = printer.save_variables.variables.z_printbed_offset | default(0.4) | float | round(3) %}

    {% if printer['gcode_button pa0'].state == "PRESSED" %}
        RESPOND TYPE=command MSG="Z-end button hit at {Z_POSITION}"
        SAVE_VARIABLE VARIABLE=z_endstop_hit VALUE={Z_POSITION}
        {% set CALCULATED_Z_PROBE_OFFSET = Z_PROBE_OFFSET + Z_POSITION * -1 - Z_PRINTBED_OFFSET %}
        SAVE_VARIABLE VARIABLE=z_calculate_probe VALUE={CALCULATED_Z_PROBE_OFFSET}
        RESPOND TYPE=command MSG="Recommended z_offset = {CALCULATED_Z_PROBE_OFFSET}"
        RESPOND TYPE=command MSG="Edit printer.cfg [probe] z_offset to {CALCULATED_Z_PROBE_OFFSET}"
    {% endif %}

[gcode_macro WIPE_NOZZLE]
description: Zig-zag nozzle wipe with temperature check and Z-hop
gcode:
    {% set passes = params.PASSES|default(3)|int %}
    {% if passes < 5 %}
        {% set passes = 5 %}
    {% endif %}

    {% set min_temp = 200 %}
    {% set speed = 1000 %}      # 20 mm/s
    {% set travel_speed = 3000 %}  # 50 mm/s for non-wipe moves

    {% set y_start = 240.0 %}
    {% set y_end = 236.0 %}
    {% set x_left = 80.0 %}
    {% set x_right = 88.0 %}
    {% set wipe_z = -0.5 %}
    {% set safe_z = 5.0 %}

    {% if printer.extruder.temperature < min_temp %}
      M117 Heating for wipe...
      M109 S{min_temp}
    {% else %}
      M117 Hotend already above {min_temp}C, starting wipe
    {% endif %}

    G90

    # Lift before moving
    G1 Z{safe_z} F{travel_speed}

    # Move to start position safely
    G1 X{x_right} Y{y_start} F{travel_speed}

    # Lower to wipe height
    G1 Z{wipe_z} F{travel_speed}

    # Set wipe speed
    G1 F{speed}

    {% for i in range(passes) %}
        {% set y_pos = y_start - ((y_start - y_end) * (i / (passes - 1 if passes > 1 else 1))) %}
        G1 X{x_left} Y{y_pos}
        G1 X{x_right} Y{y_pos}
    {% endfor %}

    # Lift after wiping
    G1 Z{safe_z} F{travel_speed}
    M104 S0   ; turn off hotend heater after wipe
    
