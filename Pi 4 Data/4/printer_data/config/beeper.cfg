#[mcu rpi]
#serial: /tmp/klipper_host_mcu

[output_pin beeper]
pin: rpi:gpio26
pwm: False
value: 0
shutdown_value: 0

[gcode_macro beeper]
description: Makes buzzer sounds (i=number of beeps, p=duration in ms)
gcode:
    {% set i = params.I|default(1)|int %}
    {% set dur = params.P|default(100)|int %}
    {% for _ in range(i) %}
        SET_PIN PIN=beeper VALUE=1
        G4 P{dur}
        SET_PIN PIN=beeper VALUE=0
        G4 P{dur}
    {% endfor %}

