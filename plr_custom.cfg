# Managed by KlipperPLR-Custom-Anycubic-Kobra-2-Neo.
# Edit this active config in Mainsail; updates preserve these settings.
[gcode_shell_command clear_plr_custom]
command: /bin/bash {PLR_DIR}/clear_plr.sh
timeout: 10

[gcode_shell_command POWER_LOSS_RESUME]
command: /bin/bash {PLR_DIR}/plr.sh
timeout: 420

[gcode_macro EXCLUDE_OBJECT]
rename_existing: EXCLUDE_OBJECT_BASE
gcode:
  {% set stored = printer.save_variables.variables.plr_excluded_objects|default('', true)|string %}
  {% set name = params.NAME|default('')|upper %}
  {% set current = printer.exclude_object.current_object|default('', true)|upper %}
  {% set reset = params.RESET|default(0)|int != 0 %}
  {% set current_requested = params.CURRENT|default(0)|int != 0 %}
  {% set target = name if name else current if current_requested else '' %}
  {% set names = namespace(values=[]) %}
  {% if not reset %}
    {% for stored_name in stored.split() %}
      {% set _ = names.values.append(stored_name) %}
    {% endfor %}
  {% elif name %}
    {% for stored_name in stored.split() %}
      {% if stored_name != name %}
        {% set _ = names.values.append(stored_name) %}
      {% endif %}
    {% endfor %}
  {% endif %}
  {% if not reset and target and target not in names.values %}
    {% set _ = names.values.append(target) %}
  {% endif %}
  EXCLUDE_OBJECT_BASE {rawparams}
  {% if reset or target %}
    SAVE_VARIABLE VARIABLE=plr_excluded_objects VALUE='"{names.values|join(" ")}"'
  {% endif %}

[gcode_macro EXCLUDE_OBJECT_DEFINE]
rename_existing: EXCLUDE_OBJECT_DEFINE_BASE
gcode:
  {% set reset = params.RESET|default(0)|int != 0 %}
  EXCLUDE_OBJECT_DEFINE_BASE {rawparams}
  {% if reset %}
    SAVE_VARIABLE VARIABLE=plr_excluded_objects VALUE='""'
  {% endif %}

[gcode_macro G31]
gcode:
  RUN_SHELL_COMMAND CMD=clear_plr_custom

[gcode_macro save_last_file]
gcode:
  {% set filepath = printer.virtual_sdcard.file_path %}
  {% set filename = filepath.split('/')[-1] %}
  SAVE_VARIABLE VARIABLE=last_file VALUE='"{filename}"'
  SAVE_VARIABLE VARIABLE=filepath VALUE='"{filepath}"'
  M118 Last File: {filename}

[gcode_macro clear_last_file]
gcode:
  SAVE_VARIABLE VARIABLE=last_file VALUE='""'
  SAVE_VARIABLE VARIABLE=filepath VALUE='""'

[gcode_macro LOG_Z]
gcode:
  {% set z_pos = printer.gcode_move.gcode_position.z %}
  SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z_pos}
  RESPOND MSG="Saved PLR Z={z_pos}"

[gcode_macro RESUME_INTERRUPTED]
gcode:
  {% set z_height = printer.save_variables.variables.power_resume_z|default(0)|float %}
  {% set last_file = printer.save_variables.variables.last_file|default('')|string %}
  {% set filepath = printer.save_variables.variables.filepath|default('')|string %}
  {% set was_interrupted = printer.save_variables.variables.was_interrupted|default(false)|string|lower == 'true' %}
  {% set bed_preheat_factor = 1.05 %}
  {% set nozzle_preheat_factor = 1.05 %}
  {% set z_lift = 2 %}
  {% set dwell_ms = 0 %}
  {% set fan_off_layers = 2 %}
  {% set enclosure_wait_ms = 30000 %}
  {% if not was_interrupted or not filepath or not last_file or z_height <= 0 %}
    RESPOND TYPE=error MSG="No valid interrupted print is saved; recovery was not started"
  {% else %}
    RUN_SHELL_COMMAND CMD=POWER_LOSS_RESUME PARAMS="{z_height} \"{last_file}\" {bed_preheat_factor} {nozzle_preheat_factor} {z_lift} {dwell_ms} {fan_off_layers} {enclosure_wait_ms}"
    SDCARD_PRINT_FILE FILENAME=plr_custom/"{last_file}"
  {% endif %}
